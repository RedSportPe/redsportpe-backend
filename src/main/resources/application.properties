# ===== Application =====
spring.application.name=redsport-backend
server.port=8080

# ===== PostgreSQL (local, native install) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/redsport
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# 'validate' = respeta tu schema existente, solo verifica que las entities coincidan.
# NUNCA 'create' o 'update' aquí: tu SQL es la fuente de verdad, Hibernate no debe tocar las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration-days=7