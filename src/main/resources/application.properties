# ===== Application =====
spring.application.name=redsport-backend
server.port=8080

# ===== PostgreSQL (local, native install) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/redsport}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# 'validate' = respeta tu schema existente, solo verifica que las entities coincidan.
# NUNCA 'create' o 'update' aquí: tu SQL es la fuente de verdad, Hibernate no debe tocar las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration-days=7
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.seed-admin.enabled=${SEED_ADMIN_ENABLED:false}
app.seed-admin.email=${SEED_ADMIN_EMAIL:}
app.seed-admin.password=${SEED_ADMIN_PASSWORD:}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.payment.qr-image-url=${PAYMENT_QR_IMAGE_URL:}
app.payment.recipient=${PAYMENT_RECIPIENT:}
